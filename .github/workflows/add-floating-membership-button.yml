name: Add floating membership button

on:
  push:
    paths:
      - '.github/workflows/add-floating-membership-button.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add floating membership button to main feed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          css_marker='.payment-close{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer}'
          css_add='.feed-membership-float{position:fixed;right:14px;bottom:18px;z-index:1400;width:62px;height:62px;border:1px solid rgba(255,231,145,.72);border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff1a9 0,#e8c85d 34%,#b98724 72%,#71500d 100%);color:#181004;font-size:8px;line-height:1.08;font-weight:950;text-align:center;padding:7px;box-shadow:0 8px 28px rgba(229,193,79,.35),0 0 18px rgba(255,224,119,.2);cursor:pointer;transition:transform .16s ease,opacity .16s ease}.feed-membership-float:active{transform:scale(.94)}.feed-membership-float[hidden]{display:none!important}'
          if css_add not in s:
              if css_marker not in s: raise SystemExit('payment css marker not found')
              s=s.replace(css_marker,css_marker+'\n    '+css_add,1)

          html_marker='<div class="payment-modal" id="payment-modal" aria-hidden="true">'
          float_html='<button class="feed-membership-float" id="feed-membership-float" type="button" aria-label="Buy Membership">Buy<br>Membership</button>\n  '
          if float_html.strip() not in s:
              if html_marker not in s: raise SystemExit('payment modal marker not found')
              s=s.replace(html_marker,float_html+html_marker,1)

          nav_marker="const nav=[...document.querySelectorAll('.nav-btn')],panels=[...document.querySelectorAll('.panel')];"
          nav_new="const nav=[...document.querySelectorAll('.nav-btn')],panels=[...document.querySelectorAll('.panel')],feedMembershipFloat=document.getElementById('feed-membership-float');"
          if nav_marker in s:
              s=s.replace(nav_marker,nav_new,1)

          old_nav="nav.forEach(btn=>btn.addEventListener('click',()=>{nav.forEach(x=>x.classList.toggle('active',x===btn));panels.forEach(p=>p.classList.toggle('active',p.id===`panel-${btn.dataset.panel}`));document.querySelectorAll('video.feed-media').forEach(v=>v.pause());window.scrollTo({top:0,behavior:'smooth'})}));"
          new_nav="nav.forEach(btn=>btn.addEventListener('click',()=>{nav.forEach(x=>x.classList.toggle('active',x===btn));panels.forEach(p=>p.classList.toggle('active',p.id===`panel-${btn.dataset.panel}`));if(feedMembershipFloat)feedMembershipFloat.hidden=btn.dataset.panel!=='updates';document.querySelectorAll('video.feed-media').forEach(v=>v.pause());window.scrollTo({top:0,behavior:'smooth'})}));"
          if old_nav in s:
              s=s.replace(old_nav,new_nav,1)

          payment_marker="document.getElementById('member-buy').onclick=openPayment;"
          payment_new="document.getElementById('member-buy').onclick=openPayment;if(feedMembershipFloat)feedMembershipFloat.onclick=openPayment;"
          if payment_marker in s:
              s=s.replace(payment_marker,payment_new,1)
          else:
              raise SystemExit('member payment handler not found')

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add floating membership button to feed" || exit 0
          git push
