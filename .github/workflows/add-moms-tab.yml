name: Add Moms Tab

on:
  push:
    paths:
      - '.github/workflows/add-moms-tab.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Moms tab update
        run: python3 tools/add_moms_tab.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Bluia Moms Pro tab" || exit 0
          git push
