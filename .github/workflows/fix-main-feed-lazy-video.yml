name: Fix Main Feed Lazy Loading and Video Playback

on:
  push:
    paths:
      - '.github/workflows/fix-main-feed-lazy-video.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply main feed fix
        run: python3 tools/fix_main_feed.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Lazy load main feed and fix video autoplay" || exit 0
          git push
