name: Add Pro IMG 4923

on:
  push:
    paths:
      - '.github/workflows/add-pro-img4923.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add image to top of Pro feed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pro/index.html')
          s=p.read_text()
          url='https://huggingface.co/buckets/Bluia/bimg/resolve/IMG_4923.jpeg?download=true'
          marker='const PHOTOS=['
          if marker not in s:
              raise SystemExit('PHOTOS marker not found')
          if url not in s:
              s=s.replace(marker, marker+'"'+url+'",', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pro/index.html
          git commit -m "Add IMG 4923 to Pro feed" || exit 0
          git push
