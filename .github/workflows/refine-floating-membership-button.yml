name: Refine floating membership button

on:
  push:
    paths:
      - '.github/workflows/refine-floating-membership-button.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine floating membership button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css='.feed-membership-float{position:fixed;right:14px;bottom:18px;z-index:1400;width:62px;height:62px;border:1px solid rgba(255,231,145,.72);border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff1a9 0,#e8c85d 34%,#b98724 72%,#71500d 100%);color:#181004;font-size:8px;line-height:1.08;font-weight:950;text-align:center;padding:7px;box-shadow:0 8px 28px rgba(229,193,79,.35),0 0 18px rgba(255,224,119,.2);cursor:pointer;transition:transform .16s ease,opacity .16s ease}.feed-membership-float:active{transform:scale(.94)}.feed-membership-float[hidden]{display:none!important}'
          new_css='.feed-membership-float{position:fixed;right:14px;bottom:18px;z-index:1400;min-width:128px;height:42px;border:1px solid rgba(236,205,108,.58);border-radius:12px;background:linear-gradient(180deg,rgba(27,24,16,.96),rgba(10,10,10,.96));color:#f2d777;font-size:10px;line-height:1;font-weight:850;letter-spacing:.15px;text-align:center;padding:0 16px;box-shadow:0 10px 28px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.025) inset;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.feed-membership-float:hover{border-color:rgba(247,220,129,.85);box-shadow:0 12px 32px rgba(0,0,0,.48),0 0 16px rgba(224,190,78,.12)}.feed-membership-float:active{transform:translateY(1px) scale(.985)}.feed-membership-float[hidden]{display:none!important}'
          if old_css not in s: raise SystemExit('current floating button css not found')
          s=s.replace(old_css,new_css,1)
          old_html='<button class="feed-membership-float" id="feed-membership-float" type="button" aria-label="Buy Membership">Buy<br>Membership</button>'
          new_html='<button class="feed-membership-float" id="feed-membership-float" type="button" aria-label="Buy Membership">Buy Membership</button>'
          if old_html not in s: raise SystemExit('current floating button html not found')
          s=s.replace(old_html,new_html,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make floating membership button professional" || exit 0
          git push
