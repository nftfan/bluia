name: Add main Magazine
on:
  push:
    paths:
      - '.github/workflows/add-main-magazine.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main page
        run: echo '' | base64 -d > /tmp/mag_patch.py && python3 /tmp/mag_patch.py
      - name: Commit
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add index.html && (git commit -m 'Replace Play tab with Magazine stories' || true) && git push
