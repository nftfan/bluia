name: Add Main Loading Animation

on:
  push:
    paths:
      - '.github/workflows/add-main-loading-animation.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply loading animation
        run: python3 tools/add_main_loading_animation.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add smooth Bluia loading and feed reveal animation" || exit 0
          git push
