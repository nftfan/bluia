name: Feed media only

on:
  push:
    paths:
      - '.github/workflows/feed-media-only.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove feed text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("<div class=\"feed-loader\" id=\"feed-loader\">Loading more Bluia updates…</div>", "<div class=\"feed-loader\" id=\"feed-loader\" aria-hidden=\"true\"></div>")
          old="if(feed.children.length){const note=document.createElement('div');note.className='update-note';note.innerHTML=`<strong>${noteFor(item.type)}</strong><span>New from Bluia Sisters</span>`;frag.appendChild(note)}"
          s=s.replace(old,'')
          s=s.replace(".update-note{margin:12px 14px;padding:12px 14px;border:1px solid rgba(255,176,207,.38);border-radius:18px;background:linear-gradient(135deg,rgba(255,222,235,.12),rgba(240,93,153,.08));color:#ffd9e7;font-size:10px;line-height:1.45;text-align:left;box-shadow:0 8px 24px rgba(242,92,154,.06)}.update-note strong{display:block;color:#fff;font-size:11px;margin-bottom:2px}.feed-loader{padding:18px 0 26px;color:#806f77;font-size:9px;text-align:center}", ".feed-loader{height:1px;padding:0;margin:0;overflow:hidden;font-size:0}")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show media only in updates feed" || exit 0
          git push
