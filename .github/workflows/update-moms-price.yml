name: Update Bluia Moms Price

on:
  push:
    paths:
      - '.github/workflows/update-moms-price.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Bluia Moms pricing copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<section class="panel" id="panel-moms"><div class="moms-wrap"><img class="moms-cover" loading="lazy" decoding="async" src="https://huggingface.co/buckets/veebluia/bluiaimages/resolve/Golden-Hour%20Countryside%20Group%20Portrait.png?download=true" alt="Bluia Moms countryside group portrait"><div class="moms-card"><div class="moms-kicker">Bluia Moms</div><h2>Bluia Moms Pro</h2><p>Unlock the private Bluia Moms collection and follow new moments as they are added.</p><div class="moms-benefits"><div class="moms-benefit">1. Explore stories</div><div class="moms-benefit">2. Bluia Moms Moments</div><div class="moms-benefit">3. Photos and Videos from Bluia Moms</div></div><button class="moms-buy" id="moms-buy" type="button">Unlock Bluia Moms Pro</button><a class="moms-telegram" href="https://t.me/mbluia" target="_blank" rel="noopener noreferrer">Bluia Moms Exclusive Telegram Channel</a></div></div></section>'
          new='<section class="panel" id="panel-moms"><div class="moms-wrap"><img class="moms-cover" loading="lazy" decoding="async" src="https://huggingface.co/buckets/veebluia/bluiaimages/resolve/Golden-Hour%20Countryside%20Group%20Portrait.png?download=true" alt="Bluia Moms countryside group portrait"><div class="moms-card"><div class="moms-kicker">Bluia Moms</div><h2>Bluia Moms Pro</h2><p>Unlock the private Bluia Moms collection and follow new moments as they are added.</p><div class="moms-benefits"><div class="moms-benefit">1. Explore stories</div><div class="moms-benefit">2. Bluia Moms Moments</div><div class="moms-benefit">3. Photos and Videos from Bluia Moms</div></div><div class="member-price"><strong>$10</strong><span>/ month</span></div><div class="member-cancel">Cancel anytime</div><button class="moms-buy" id="moms-buy" type="button">Unlock Bluia Moms Pro — $10/month</button><a class="moms-telegram" href="https://t.me/mbluia" target="_blank" rel="noopener noreferrer">Bluia Moms Exclusive Telegram Channel</a></div></div></section>'
          if old not in s:
              raise SystemExit('Bluia Moms section not found')
          s=s.replace(old,new,1)
          old2='<div class="moms-payment-modal" id="moms-payment-modal" aria-hidden="true"><div class="moms-payment-card"><button class="moms-payment-close" id="moms-payment-close" type="button" aria-label="Close">×</button><h3>Unlock Bluia Moms Pro</h3><p>Use an email address you can access at checkout. Your Bluia Moms Pro access will use that email.</p><button class="moms-payment-final" id="moms-payment-final" type="button">Continue to Bluia Moms Pro</button></div></div>'
          new2='<div class="moms-payment-modal" id="moms-payment-modal" aria-hidden="true"><div class="moms-payment-card"><button class="moms-payment-close" id="moms-payment-close" type="button" aria-label="Close">×</button><h3>Unlock Bluia Moms Pro</h3><p>$10/month. Cancel anytime. Use an email address you can access at checkout. Your Bluia Moms Pro access will use that email.</p><button class="moms-payment-final" id="moms-payment-final" type="button">Continue — $10/month</button></div></div>'
          if old2 not in s:
              raise SystemExit('Bluia Moms payment modal not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Bluia Moms price to $10 monthly" || exit 0
          git push
