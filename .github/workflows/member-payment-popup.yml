name: Add member payment popup

on:
  push:
    paths:
      - '.github/workflows/member-payment-popup.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add payment confirmation popup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          css_marker='.chat-status{min-height:18px;margin-top:8px;color:#ffb7d1;font-size:9px;line-height:1.4}'
          css_add='''.payment-modal{position:fixed;inset:0;z-index:5200;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.86);opacity:0;visibility:hidden;pointer-events:none;transition:.16s ease}.payment-modal.open{opacity:1;visibility:visible;pointer-events:auto}.payment-card{position:relative;width:min(92vw,360px);padding:22px 16px 16px;border-radius:20px;border:1px solid #5a451b;background:radial-gradient(circle at 90% 0,rgba(235,202,103,.16),transparent 34%),linear-gradient(180deg,#141108,#090909);box-shadow:0 22px 60px rgba(0,0,0,.5);text-align:center}.payment-card h3{margin:0 32px 8px;font-size:18px;color:#f1d77d}.payment-card p{margin:0 0 14px;color:#d0c5ae;font-size:10px;line-height:1.6}.payment-final{width:100%;min-height:48px;border:0;border-radius:13px;background:linear-gradient(135deg,#f0d36e,#b98724);color:#160f03;font-size:11px;font-weight:950;cursor:pointer}.payment-close{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer}'''
          if css_add not in s:
              if css_marker not in s: raise SystemExit('css marker not found')
              s=s.replace(css_marker,css_marker+'\n    '+css_add,1)

          modal_anchor='<div class="hearts-layer" id="hearts-layer"></div>'
          modal_html='''<div class="payment-modal" id="payment-modal" aria-hidden="true"><div class="payment-card"><button class="payment-close" id="payment-close" type="button" aria-label="Close">×</button><h3>Unlock Unlimited Content</h3><p>Use an email address you can access at checkout. Your private viewing link will be sent to that email.</p><button class="payment-final" id="payment-final" type="button">Continue to Payment — $5/month</button></div></div>'''
          if modal_html not in s:
              if modal_anchor not in s: raise SystemExit('modal anchor not found')
              s=s.replace(modal_anchor,modal_html+'\n  '+modal_anchor,1)

          old="document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMoment();closeChat()}});document.getElementById('member-buy').onclick=()=>{window.location.href=PAYMENT_URL};"
          new="const paymentModal=document.getElementById('payment-modal');function openPayment(){paymentModal.classList.add('open');paymentModal.setAttribute('aria-hidden','false');document.documentElement.style.overflow='hidden'}function closePayment(){paymentModal.classList.remove('open');paymentModal.setAttribute('aria-hidden','true');document.documentElement.style.overflow=''}document.getElementById('member-buy').onclick=openPayment;document.getElementById('payment-close').onclick=closePayment;paymentModal.addEventListener('click',e=>{if(e.target===paymentModal)closePayment()});document.getElementById('payment-final').onclick=()=>{window.location.href=PAYMENT_URL};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMoment();closeChat();closePayment()}});"
          if old not in s: raise SystemExit('member payment handler not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add member payment confirmation popup" || exit 0
          git push
