name: Refine Magazine pages

on:
  push:
    paths:
      - '.github/workflows/refine-magazine-pages.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine magazine typography and page numbers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.magazine{width:100%;background:#000;padding:0 0 28px}.mag-story{width:100%;margin:0;background:#000}.mag-copy{background:#f3ead7;color:#17130d;padding:22px 18px 20px}.mag-kicker{font-size:8px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;opacity:.58;margin-bottom:5px}.mag-copy h2{margin:0 0 8px;font:700 27px/1.04 Georgia,"Times New Roman",serif;letter-spacing:-.55px;color:#111}.mag-copy p{margin:0;color:#282118;font-size:10.5px;line-height:1.62;max-width:620px}.mag-photo{display:block;width:100%;height:auto;margin:0;background:#000;object-fit:cover}.mag-brand{height:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#f7eddc,#edd9ba 35%,#fffaf0 50%,#edd9ba 65%,#f7eddc);color:#19130b;font-size:8px;line-height:10px;font-weight:950;letter-spacing:1.4px;text-transform:uppercase;box-shadow:0 0 12px rgba(239,221,187,.35);position:relative;z-index:6}'
          new='.magazine{width:100%;background:#000;padding:0 0 28px;counter-reset:magpage}.mag-story{width:100%;margin:0;background:#000}.mag-copy{position:relative;counter-increment:magpage;background:#f3ead7;color:#17130d;padding:30px 20px 23px;font-family:Baskerville,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}.mag-copy::after{content:counter(magpage,decimal-leading-zero);position:absolute;top:10px;right:14px;color:#6c604f;font:italic 600 11px/1 Baskerville,"Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.8px}.mag-kicker{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:9px;font-weight:900;letter-spacing:1.25px;text-transform:uppercase;opacity:.58;margin-bottom:6px}.mag-copy h2{margin:0 0 9px;font:700 31px/1.02 Didot,"Bodoni 72",Bodoni MT,Georgia,serif;letter-spacing:-.7px;color:#111}.mag-copy p{margin:0;color:#282118;font-size:13px;line-height:1.58;max-width:680px;letter-spacing:.02px}.mag-photo{display:block;width:100%;height:auto;margin:0;background:#000;object-fit:cover}.mag-brand{height:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#f7eddc,#edd9ba 35%,#fffaf0 50%,#edd9ba 65%,#f7eddc);color:#19130b;font-size:8px;line-height:10px;font-weight:950;letter-spacing:1.4px;text-transform:uppercase;box-shadow:0 0 12px rgba(239,221,187,.35);position:relative;z-index:6}'
          if old not in s:
              raise SystemExit('Magazine CSS block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Magazine typography and page numbers" || exit 0
          git push
