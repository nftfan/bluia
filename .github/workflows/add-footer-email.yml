name: Add footer and member email

on:
  push:
    paths:
      - '.github/workflows/add-footer-email.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add copyright footer and member email
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          css_anchor='.feed-membership-float[hidden]{display:none!important}'
          css_add=css_anchor+'.member-email{display:inline-block;margin:12px auto 0;color:#f0d77a;font-size:9.5px;font-weight:800;text-decoration:none;border-bottom:1px solid rgba(240,215,122,.45);padding-bottom:2px}.site-footer{width:100%;padding:18px 12px 22px;text-align:center;background:#000;color:#766b70;font-size:9px;letter-spacing:.3px;border-top:1px solid #171717}.site-footer span{color:#a7969e}'
          if css_anchor not in s:
              raise SystemExit('footer CSS anchor not found')
          s=s.replace(css_anchor,css_add,1)

          benefits='<ul class="member-benefits"><li>Hundreds of reels</li><li>TV episodes</li><li>Photos</li><li>Play with Bluia Sisters</li><li>Read full Bluia Sisters magazine</li></ul>'
          benefits_new=benefits+'<a class="member-email" href="mailto:vbluia@outlook.com">Send me email: vbluia@outlook.com</a>'
          if benefits not in s:
              raise SystemExit('member benefits block not found')
          s=s.replace(benefits,benefits_new,1)

          main_end='  </main>\n  <div class="moment-modal"'
          main_new='  </main>\n  <footer class="site-footer">© 2026 <span>Bluia Sisters</span>. All rights reserved.</footer>\n  <div class="moment-modal"'
          if main_end not in s:
              raise SystemExit('main end marker not found')
          s=s.replace(main_end,main_new,1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add copyright footer and member email" || exit 0
          git push
