name: Add Pro Media

on:
  push:
    paths:
      - '.github/workflows/add-pro-media.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add image to Pro Feed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pro/index.html')
          s=p.read_text()
          url='https://huggingface.co/buckets/Bluia/bimg/resolve/D710BBD6-788E-4906-AFD6-F7B9C81ABECF.png?download=true'
          if url not in s:
              marker='const PHOTOS=['
              if marker not in s:
                  raise SystemExit('PHOTOS array not found')
              s=s.replace(marker, marker+'"'+url+'",', 1)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pro/index.html
          git commit -m "Add new image to Pro Feed" || exit 0
          git push
