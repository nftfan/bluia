name: Add Pro Stories

on:
  push:
    paths:
      - '.github/workflows/add-pro-stories.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Stories tab and content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pro/index.html')
          s=p.read_text()

          s=s.replace('grid-template-columns:1fr 1fr;gap:8px', 'grid-template-columns:repeat(3,minmax(0,1fr));gap:8px', 1)

          css='.stories-wrap{width:min(100%,720px);margin:0 auto;padding:0 0 38px;background:#000}.stories-head{padding:18px 16px 14px;border-bottom:1px solid #3b2f17;background:linear-gradient(180deg,#100d07,#050505)}.stories-head h1{margin:0;color:#f0d36f;font:700 28px/1 Georgia,"Times New Roman",serif}.stories-head p{margin:7px 0 0;color:#9f9475;font-size:9px;line-height:1.5}.story-card{border-bottom:1px solid #3b2f17;background:#000}.story-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 8px;color:#bba76b;font-size:8px;font-weight:850;letter-spacing:.9px;text-transform:uppercase}.story-copy{padding:0 16px 18px}.story-copy h2{margin:0 0 6px;color:#f7e7ae;font:700 30px/1.02 Georgia,"Times New Roman",serif;letter-spacing:-.5px}.story-by{margin:0 0 13px;color:#b7aa85;font-size:9px;font-style:italic}.story-copy p{margin:0 0 12px;color:#ded6c0;font:14px/1.65 Georgia,"Times New Roman",serif}.story-photo{display:block;width:100%;height:auto;background:#090909}.story-divider{height:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#3c2c08,#d4b34c 30%,#fff1aa 50%,#d4b34c 70%,#3c2c08);color:#150f02;font-size:8px;line-height:10px;font-weight:950;letter-spacing:1.4px;text-transform:uppercase}.story-end{padding:5px 0 0;color:#776c50;font-size:8px;text-align:center;letter-spacing:.4px}'
          marker='.modal{position:fixed;'
          if marker not in s: raise SystemExit('CSS marker missing')
          s=s.replace(marker, css+marker, 1)

          oldnav='<nav class="topnav" aria-label="Bluia Sisters Pro navigation"><button class="nav-btn active" data-panel="feed" type="button">Pro Feed</button><button class="nav-btn" data-panel="play" type="button">Play</button></nav>'
          newnav='<nav class="topnav" aria-label="Bluia Sisters Pro navigation"><button class="nav-btn active" data-panel="feed" type="button">Pro Feed</button><button class="nav-btn" data-panel="play" type="button">Play</button><button class="nav-btn" data-panel="stories" type="button">Stories</button></nav>'
          if oldnav not in s: raise SystemExit('nav marker missing')
          s=s.replace(oldnav,newnav,1)

          oldmain='</div></div></section></main>'
          stories='''</div></div></section><section class="panel" id="panel-stories"><div class="stories-wrap"><header class="stories-head"><h1>Stories</h1><p>Newest stories appear first. Higher page numbers mean newer publication.</p></header><article class="story-card"><div class="story-divider">Bluia Sisters Pro</div><div class="story-meta"><span>Page 09</span><span>Latest Story</span></div><div class="story-copy"><h2>Love Hurts</h2><div class="story-by">By Kendra Bluia</div><p>I used to think heartbreak announced itself loudly. I imagined slammed doors, last messages and a clean ending you could point to. What I learned instead is that love can hurt quietly. Sometimes nothing dramatic happens at all. Two people simply stop meeting each other in the same place.</p><p>At first I kept searching for the exact moment things changed. I replayed conversations, reread old words and tried to decide which version of us had been real. The difficult answer was that all of them were. Love can be sincere and still fail. A beautiful memory does not become false just because it does not become a future.</p></div><img class="story-photo" src="https://huggingface.co/buckets/Bluia/bimg/resolve/IMG_4923.jpeg?download=true" alt="Love Hurts by Kendra Bluia"><div class="story-copy"><p>The hardest part was letting go of the person I had become inside that relationship. I had built small routines around being expected, understood and chosen. When that disappeared, even ordinary days felt unfamiliar. I confused missing the routine with needing the relationship back.</p><p>Eventually I stopped asking whether I had been enough. That question kept me trapped because it treated love like an exam with a score. Two people can care deeply and still be wrong for each other in the life they are actually living. No amount of effort can turn incompatibility into peace.</p></div><img class="story-photo" src="https://huggingface.co/buckets/Bluia/bimg/resolve/F434CB7E-6C2A-4DCD-B739-8D025984972E.png?download=true" alt="Kendra Bluia Love Hurts story"><div class="story-copy"><p>Healing did not arrive as one brave decision. It came in smaller choices: not checking, not reopening a conversation that had already ended, going somewhere new, laughing without feeling guilty, and letting a day pass without measuring it against the past.</p><p>I still believe in love. I just believe in it differently now. Love should not require you to disappear inside it. If it hurts, the pain can teach you where your boundaries were missing and what kind of tenderness you need next time. The ending did not make me colder. It made me clearer.</p><div class="story-end">End of Love Hurts</div></div><img class="story-photo" src="https://huggingface.co/buckets/Bluia/bimg/resolve/DC7A7A10-5740-489B-9E2A-2686358B490D.png?download=true" alt="Love Hurts story ending"></article><article class="story-card"><div class="story-divider">Bluia Sisters Pro</div><div class="story-meta"><span>Page 06</span><span>Story</span></div><div class="story-copy"><h2>Our Style</h2><div class="story-by">By Kaira Bluia</div><p>Our style moves between elegant, playful and relaxed. The common thread is a look that feels intentional while still leaving room for personality.</p></div><img class="story-photo" src="https://huggingface.co/buckets/Bluia/bimg/resolve/B2041FE1-808D-4F35-9107-473F5A357623.png?download=true" alt="Our Style"><div class="story-copy"><p>We mix simple foundations with expressive details, letting color, hair, accessories or posture carry the mood instead of overloading every piece.</p><p>For us, style is less about a fixed uniform and more about a recognizable energy: feminine, confident, modern and always a little unexpected.</p></div></article><article class="story-card"><div class="story-divider">Bluia Sisters Pro</div><div class="story-meta"><span>Page 03</span><span>Story</span></div><div class="story-copy"><h2>Fashion Sense</h2><div class="story-by">By Kaira Bluia</div><p>Our fashion sense is built around confidence, clean silhouettes and one memorable detail. We like looks that feel polished without becoming too perfect.</p></div><img class="story-photo" src="https://huggingface.co/buckets/Bluia/bimg/resolve/CB41C504-F995-4471-AC6F-2D8DA7909017.png?download=true" alt="Fashion Sense"><div class="story-copy"><p>Texture, shape and attitude matter more than following every trend. A strong outfit should still feel natural when the camera is gone.</p><p>The final touch is balance: something soft with something bold, something classic with something playful. That contrast is where the look becomes ours.</p></div></article></div></section></main>'''
          if oldmain not in s: raise SystemExit('main marker missing')
          s=s.replace(oldmain,stories,1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pro/index.html
          git commit -m "Add Stories tab to Pro" || exit 0
          git push
