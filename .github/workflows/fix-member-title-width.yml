name: Fix Members title width

on:
  push:
    paths:
      - '.github/workflows/fix-member-title-width.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Members title sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.member-title-small{font-size:13px!important;line-height:1.2!important;white-space:nowrap;letter-spacing:-.25px;margin-bottom:12px!important}'
          new='.member-title-small{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important;font-size:10px!important;line-height:1.2!important;font-weight:850!important;white-space:nowrap;letter-spacing:-.3px;margin:0 auto 12px!important;max-width:100%;text-align:center}'
          if old not in s:
              raise SystemExit('member title CSS marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Members title overflow" || exit 0
          git push
