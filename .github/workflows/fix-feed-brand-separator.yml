name: Fix feed brand separators

on:
  push:
    paths:
      - '.github/workflows/fix-feed-brand-separator.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one brand bar between media items
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const bottomBrand=document.createElement('div');bottomBrand.className='feed-brand';bottomBrand.textContent='Bluia Sisters';wrap.appendChild(bottomBrand);return wrap}"
          new="return wrap}"
          if old not in s:
              raise SystemExit('duplicate bottom brand block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show one Bluia Sisters bar between feed media" || exit 0
          git push
