name: Add Threads social button

on:
  push:
    paths:
      - '.github/workflows/add-threads-social.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Threads button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.social-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}', '.social-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}', 1)
          fb='''<a class="social-link social-facebook" href="https://www.facebook.com/share/1VENvhfpMJ/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-white" d="M13.8 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5H17V4a21 21 0 0 0-2.4-.1c-2.4 0-4.1 1.5-4.1 4.2V10H8v3h2.5v8h3.3Z"/></svg></a>'''
          th='''<a class="social-link social-threads" href="https://www.threads.com/@bluia_sisters?igshid=NTc4MTIwNjQ2YQ==" target="_blank" rel="noopener noreferrer" aria-label="Threads"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-none" d="M12 3.2c-4.8 0-8.2 3.4-8.2 8.7 0 5.4 3.2 8.9 8.3 8.9 4.2 0 7.2-2.2 7.2-5.6 0-2.8-1.9-4.6-5.1-4.8-2.8-.2-4.9 1.2-4.9 3.3 0 1.8 1.5 3 3.5 3 2.8 0 4.6-2.2 4.6-5.6 0-4.9-2.2-7.9-5.5-7.9-2.6 0-4.6 1.5-5.3 3.8"/></svg></a>'''
          if th not in s:
              if fb not in s: raise SystemExit('Facebook social button target not found')
              s=s.replace(fb,fb+th,1)
          if '.social-threads{' not in s:
              marker='.social-facebook{background:linear-gradient(135deg,#1877f2,#0f5fc5);border-color:#3f8df4}'
              if marker not in s: raise SystemExit('social css marker not found')
              s=s.replace(marker,marker+'.social-threads{background:#111;border-color:#4a4a4a}',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Threads to Members social links" || exit 0
          git push
