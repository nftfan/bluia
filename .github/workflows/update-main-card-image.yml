name: Update main website card image

on:
  push:
    paths:
      - '.github/workflows/update-main-card-image.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace main website card image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='https://huggingface.co/buckets/Bluia/bimg/resolve/IMG_4923.jpeg?download=true'
          new='https://huggingface.co/buckets/Bluia/bimg/resolve/CB41C504-F995-4471-AC6F-2D8DA7909017.png?download=true'
          if old not in s:
              raise SystemExit('old main card image URL not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update main website card image" || exit 0
          git push
