name: Add Pro three media 2

on:
  push:
    paths:
      - '.github/workflows/add-pro-three-media-2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add three images to Pro feed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pro/index.html')
          s=p.read_text()
          marker='const PHOTOS=['
          if marker not in s:
              raise SystemExit('PHOTOS marker not found')
          urls=[
            'https://huggingface.co/buckets/Bluia/bimg/resolve/CB41C504-F995-4471-AC6F-2D8DA7909017.png?download=true',
            'https://huggingface.co/buckets/Bluia/bimg/resolve/6376DFDC-5696-4994-B1E5-6273DD959B73.png?download=true',
            'https://huggingface.co/buckets/Bluia/bimg/resolve/0FB83428-CF4A-4A26-8B51-DB1F9234D2E3.png?download=true'
          ]
          for u in urls:
              if u in s:
                  raise SystemExit(f'already present: {u}')
          insert=''.join('"'+u+'",' for u in urls)
          s=s.replace(marker,marker+insert,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pro/index.html
          git commit -m "Add three new images to Pro feed" || exit 0
          git push
