name: Remove Members Count

on:
  push:
    paths:
      - '.github/workflows/remove-members-count.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Members count
        run: python3 tools/remove_members_count.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove Members tab count" || exit 0
          git push
