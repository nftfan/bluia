name: Members 1500 media count

on:
  push:
    paths:
      - '.github/workflows/member-count-unlimited.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update members count and copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.media-count{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:#fff;color:#111;font-size:8px;font-weight:950;box-shadow:0 0 10px rgba(255,255,255,.55)}', '.media-count{min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;border-radius:999px;background:#fff;color:#111;font-size:8px;font-weight:950;box-shadow:0 0 10px rgba(255,255,255,.55)}')
          s=s.replace('<button class="nav-btn" data-panel="members" type="button">Members</button>', '<button class="nav-btn" data-panel="members" type="button">Members <span class="media-count">1500</span></button>')
          s=s.replace('<h2>Unlock all the updates</h2><p>Become a member to unlock the complete Bluia Sisters feed instead of only the public preview.</p><div class="unlock-list"><div class="unlock-row">✓ Full TV episodes, reels and photo updates.</div><div class="unlock-row">✓ New Bluia Sisters content as it is added.</div><div class="unlock-row">✓ Your private viewing link is sent to the email used at checkout.</div></div>', '<h2>Unlock the unlimited feed</h2><p>Become a member to unlock the unlimited Bluia Sisters feed with 1,500 media updates and everything added next.</p><div class="unlock-list"><div class="unlock-row">✓ Unlimited feed with TV episodes, reels and photos.</div><div class="unlock-row">✓ 1,500 media updates with new Bluia Sisters content added continuously.</div><div class="unlock-row">✓ Smooth mixed feed: photos always separate videos — never two videos together.</div><div class="unlock-row">✓ Your private viewing link is sent to the email used at checkout.</div></div>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show 1500 member media and unlimited feed" || exit 0
          git push
