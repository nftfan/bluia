name: Add Magazine membership CTA

on:
  push:
    paths:
      - '.github/workflows/add-magazine-membership-cta.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Magazine membership call to action
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          css_marker='.mag-brand{height:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#f7eddc,#edd9ba 35%,#fffaf0 50%,#edd9ba 65%,#f7eddc);color:#19130b;font-size:8px;line-height:10px;font-weight:950;letter-spacing:1.4px;text-transform:uppercase;box-shadow:0 0 12px rgba(239,221,187,.35);position:relative;z-index:6}'
          css_add=css_marker+'.mag-cta{padding:30px 20px 34px;background:linear-gradient(180deg,#17130d,#0b0906);text-align:center;border-top:1px solid rgba(239,221,187,.22)}.mag-cta h3{margin:0 0 8px;color:#f6ead1;font:700 25px/1.05 Didot,"Bodoni 72",Bodoni MT,Georgia,serif;letter-spacing:-.5px}.mag-cta p{margin:0 auto 16px;max-width:420px;color:#c9bda5;font:13px/1.55 Baskerville,"Palatino Linotype",Palatino,Georgia,serif}.mag-cta button{min-width:220px;min-height:48px;padding:0 22px;border:1px solid #e4c977;border-radius:999px;background:linear-gradient(135deg,#f2da83,#b98a2c);color:#171005;font-size:10.5px;font-weight:950;letter-spacing:.25px;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.34)}.mag-cta button:active{transform:scale(.985)}'
          if css_marker not in s:
              raise SystemExit('Magazine brand CSS marker not found')
          s=s.replace(css_marker,css_add,1)

          end_marker='<div class="mag-brand">Bluia Sisters</div></article></div><div class="inner">'
          cta='<div class="mag-brand">Bluia Sisters</div><div class="mag-cta"><h3>More Stories Await</h3><p>Become a member to read more stories by Bluia Sisters and unlock the full members collection.</p><button id="magazine-member" type="button">Become a Member</button></div></article></div><div class="inner">'
          if end_marker not in s:
              raise SystemExit('Magazine ending marker not found')
          s=s.replace(end_marker,cta,1)

          js_marker="document.getElementById('member-buy').onclick=openPayment;"
          js_add=js_marker+"const magazineMember=document.getElementById('magazine-member');if(magazineMember)magazineMember.onclick=openPayment;"
          if js_marker not in s:
              raise SystemExit('Payment hook marker not found')
          s=s.replace(js_marker,js_add,1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Magazine membership CTA" || exit 0
          git push
