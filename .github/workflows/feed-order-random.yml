name: Randomize feed order safely

on:
  push:
    paths:
      - '.github/workflows/feed-order-random.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update feed ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const baseItems=[...TV.map(src=>({type:'tv',src})),...REELS.map(src=>({type:'reel',src})),...PHOTOS.map(src=>({type:'photo',src}))];let queue=shuffle(baseItems),cursor=0,loading=false;const feed=document.getElementById('feed'),loader=document.getElementById('feed-loader');"
          new="const photoItems=PHOTOS.map(src=>({type:'photo',src}));const videoItems=[...TV.map(src=>({type:'tv',src})),...REELS.map(src=>({type:'reel',src}))];function buildQueue(){const photos=shuffle(photoItems),videos=shuffle(videoItems),gaps=shuffle(Array.from({length:Math.max(0,photos.length-1)},(_,i)=>i));const videoAfter=new Map();gaps.slice(0,Math.min(videos.length,gaps.length)).forEach((gapIndex,i)=>videoAfter.set(gapIndex,videos[i]));const out=[];photos.forEach((photo,i)=>{out.push(photo);if(videoAfter.has(i))out.push(videoAfter.get(i))});return out}let queue=buildQueue(),cursor=0,loading=false;const feed=document.getElementById('feed'),loader=document.getElementById('feed-loader');"
          if old not in s:
              raise SystemExit('target queue block not found')
          s=s.replace(old,new,1)
          s=s.replace("if(cursor>=queue.length){queue=shuffle(baseItems);cursor=0}","if(cursor>=queue.length){queue=buildQueue();cursor=0}")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Randomize feed with photos between videos"
          git push
