name: Polish Magazine look

on:
  push:
    paths:
      - '.github/workflows/polish-magazine-look.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish magazine labels and typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old='.magazine{width:100%;background:#000;padding:0 0 28px;counter-reset:magpage}.mag-story{width:100%;margin:0;background:#000}.mag-copy{position:relative;counter-increment:magpage;background:#f3ead7;color:#17130d;padding:30px 20px 23px;font-family:Baskerville,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}.mag-copy::after{content:counter(magpage,decimal-leading-zero);position:absolute;top:10px;right:14px;color:#6c604f;font:italic 600 11px/1 Baskerville,"Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.8px}.mag-kicker{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:9px;font-weight:900;letter-spacing:1.25px;text-transform:uppercase;opacity:.58;margin-bottom:6px}.mag-copy h2{margin:0 0 9px;font:700 31px/1.02 Didot,"Bodoni 72",Bodoni MT,Georgia,serif;letter-spacing:-.7px;color:#111}.mag-copy p{margin:0;color:#282118;font-size:13px;line-height:1.58;max-width:680px;letter-spacing:.02px}.mag-photo{display:block;width:100%;height:auto;margin:0;background:#000;object-fit:cover}.mag-brand{height:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#f7eddc,#edd9ba 35%,#fffaf0 50%,#edd9ba 65%,#f7eddc);color:#19130b;font-size:8px;line-height:10px;font-weight:950;letter-spacing:1.4px;text-transform:uppercase;box-shadow:0 0 12px rgba(239,221,187,.35);position:relative;z-index:6}'
          new='.magazine{width:100%;background:#000;padding:0 0 28px;counter-reset:magpage}.mag-story{width:100%;margin:0;background:#000}.mag-copy{position:relative;counter-increment:magpage;background:linear-gradient(180deg,#f8f0df 0%,#efe2ca 100%);color:#17130d;padding:36px 22px 26px;font-family:Baskerville,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;border-top:1px solid rgba(90,68,35,.12);border-bottom:1px solid rgba(90,68,35,.12)}.mag-copy::after{content:"Page " counter(magpage,decimal-leading-zero);position:absolute;top:11px;right:15px;color:#756650;font:italic 600 11px/1 Baskerville,"Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.7px}.mag-kicker{font-family:Baskerville,"Palatino Linotype",Palatino,Georgia,serif;font-size:11px;font-style:italic;font-weight:600;letter-spacing:.25px;text-transform:none;opacity:.72;margin-bottom:8px}.mag-copy h2{display:inline-block;margin:0 0 13px;font:700 34px/.98 Didot,"Bodoni 72",Bodoni MT,Georgia,serif;letter-spacing:-.9px;color:#0d0b08;padding-bottom:5px;border-bottom:2px solid #8f7350;text-shadow:0 1px 0 rgba(255,255,255,.65)}.mag-copy p{margin:0;color:#2b241b;font-size:14px;line-height:1.62;max-width:680px;letter-spacing:.04px}.mag-photo{display:block;width:100%;height:auto;margin:0;background:#000;object-fit:cover}.mag-brand{height:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#f7eddc,#edd9ba 35%,#fffaf0 50%,#edd9ba 65%,#f7eddc);color:#19130b;font-size:8px;line-height:10px;font-weight:950;letter-spacing:1.4px;text-transform:uppercase;box-shadow:0 0 12px rgba(239,221,187,.35);position:relative;z-index:6}'
          if old not in s:
              raise SystemExit('current Magazine CSS block not found')
          s=s.replace(old,new,1)
          s=s.replace('Magazine Story 01','By: Kaira Bluia',1)
          s=s.replace('Magazine Story 02','By: Kaira Bluia',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish Magazine titles and page labels" || exit 0
          git push
