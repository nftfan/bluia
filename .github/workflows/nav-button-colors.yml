name: Distinct navigation button colors

on:
  push:
    paths:
      - '.github/workflows/nav-button-colors.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Color Play and Members buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='.nav-btn.active{border-color:transparent;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 6px 20px rgba(242,92,154,.2)}'
          add='''\n    .nav-btn[data-panel="play"]{background:linear-gradient(135deg,#745cff,#3f32c9);border-color:#8879ff;color:#fff;box-shadow:0 6px 20px rgba(111,88,255,.2)}\n    .nav-btn[data-panel="play"].active{background:linear-gradient(135deg,#8a73ff,#4a39da);border-color:#a395ff;box-shadow:0 6px 22px rgba(119,95,255,.34)}\n    .nav-btn[data-panel="members"]{background:linear-gradient(135deg,#f3d978,#b88624);border-color:#e3c35d;color:#1a1203;box-shadow:0 6px 20px rgba(224,184,65,.22)}\n    .nav-btn[data-panel="members"].active{background:linear-gradient(135deg,#ffe58b,#c9952c);border-color:#f6d96d;color:#140e02;box-shadow:0 6px 24px rgba(233,194,71,.38)}'''
          if add.strip() not in s:
              if marker not in s:
                  raise SystemExit('nav marker not found')
              s=s.replace(marker,marker+add,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Give Play and Members distinct colors" || exit 0
          git push
