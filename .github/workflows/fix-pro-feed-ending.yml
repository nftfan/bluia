name: Fix Pro feed ending

on:
  push:
    paths:
      - '.github/workflows/fix-pro-feed-ending.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Pro feed finite and deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pro/index.html')
          s=p.read_text()

          s=s.replace('.feed-loader{height:1px;overflow:hidden}', '.feed-loader{height:1px;overflow:hidden}.feed-end{display:none;padding:22px 14px calc(28px + env(safe-area-inset-bottom));text-align:center;color:#8f8053;font-size:9px;letter-spacing:.35px;background:#000}.feed-end.show{display:block}', 1)
          s=s.replace('<div class="feed" id="feed"></div><div class="feed-loader" id="feed-loader"></div></section>', '<div class="feed" id="feed"></div><div class="feed-loader" id="feed-loader"></div><div class="feed-end" id="feed-end">End of Pro Feed</div></section>', 1)

          old="const videos=[...TV.map(src=>({type:'tv',src})),...REELS.map(src=>({type:'reel',src}))];const queue=[];PHOTOS.forEach((src,i)=>{queue.push({type:'photo',src});if(i<videos.length)queue.push(videos[i])});let cursor=0,loading=false;const feed=document.getElementById('feed'),loader=document.getElementById('feed-loader'),startup=document.getElementById('feed-startup');"
          new="const videos=[...TV.map(src=>({type:'tv',src})),...REELS.map(src=>({type:'reel',src}))];const queue=[];PHOTOS.forEach((src,i)=>{queue.push({type:'photo',src});if(i<videos.length)queue.push(videos[i])});let cursor=0,loading=false;const feed=document.getElementById('feed'),loader=document.getElementById('feed-loader'),startup=document.getElementById('feed-startup'),feedEnd=document.getElementById('feed-end');"
          if old not in s: raise SystemExit('queue marker not found')
          s=s.replace(old,new,1)

          old2="function appendBatch(n=7){if(loading)return;loading=true;const frag=document.createDocumentFragment();for(let i=0;i<n;i++){if(cursor>=queue.length)cursor=0;frag.appendChild(makeItem(queue[cursor++]));}feed.appendChild(frag);loading=false;if(startup&&!startup.classList.contains('done'))requestAnimationFrame(()=>startup.classList.add('done'))}\nappendBatch(8);new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))appendBatch(7)},{rootMargin:'800px 0px'}).observe(loader);"
          new2="let feedObserver=null;function finishFeed(){if(feedEnd)feedEnd.classList.add('show');if(loader)loader.style.display='none';if(feedObserver&&loader)feedObserver.unobserve(loader)}function appendBatch(n=7){if(loading||cursor>=queue.length)return;loading=true;const frag=document.createDocumentFragment();const end=Math.min(cursor+n,queue.length);while(cursor<end)frag.appendChild(makeItem(queue[cursor++]));feed.appendChild(frag);loading=false;if(startup&&!startup.classList.contains('done'))requestAnimationFrame(()=>startup.classList.add('done'));if(cursor>=queue.length)finishFeed()}\nappendBatch(8);feedObserver=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))appendBatch(7)},{rootMargin:'800px 0px'});if(cursor<queue.length)feedObserver.observe(loader);"
          if old2 not in s: raise SystemExit('appendBatch marker not found')
          s=s.replace(old2,new2,1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pro/index.html
          git commit -m "End Pro feed after all media" || exit 0
          git push
