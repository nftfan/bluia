name: Add Pro three media

on:
  push:
    paths:
      - '.github/workflows/add-pro-three-media.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add three images to Pro feed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pro/index.html')
          s=p.read_text()
          marker='const PHOTOS=['
          if marker not in s:
              raise SystemExit('PHOTOS marker not found')
          urls=[
            'https://huggingface.co/buckets/Bluia/bimg/resolve/B2041FE1-808D-4F35-9107-473F5A357623.png?download=true',
            'https://huggingface.co/buckets/Bluia/bimg/resolve/960EE242-6C07-4D1A-B682-67997AACD51E.png?download=true',
            'https://huggingface.co/buckets/Bluia/bimg/resolve/949F7146-EFE1-4F84-904E-5A352A2B6E00.png?download=true'
          ]
          for u in urls:
              if u in s:
                  raise SystemExit(f'already present: {u}')
          insert=''.join('"'+u+'",' for u in urls)
          s=s.replace(marker,marker+insert,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pro/index.html
          git commit -m "Add three images to Pro feed" || exit 0
          git push
