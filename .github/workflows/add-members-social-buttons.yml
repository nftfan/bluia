name: Add members social buttons

on:
  push:
    paths:
      - '.github/workflows/add-members-social-buttons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add social buttons to Members
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css_marker='.member-card-simple .telegram-link small{font-size:7.5px}'
          css_add='''.social-follow{margin:16px 0 7px;color:#d8cab1;font-size:9px;font-weight:800;letter-spacing:.25px}.social-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.social-link{min-height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;text-decoration:none;background:#0d0d0d;border:1px solid #2b2b2b;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:transform .15s ease,background .15s ease}.social-link:active{transform:scale(.96)}.social-link svg{width:20px;height:20px;display:block}.social-instagram{background:linear-gradient(135deg,#4c29a8,#c32f87 52%,#f28b30);border-color:#b94c91}.social-tiktok{background:#080808;border-color:#333}.social-x{background:#111;border-color:#3a3a3a}.social-facebook{background:linear-gradient(135deg,#1877f2,#0f5fc5);border-color:#3f8df4}.social-link .icon-white{fill:#fff}.social-link .icon-none{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}'''
          if css_add not in s:
              if css_marker not in s: raise SystemExit('member css marker not found')
              s=s.replace(css_marker,css_marker+'\n    '+css_add,1)
          old='<p class="member-note">Use an email address you can access at checkout. Your private viewing link will be sent to that email.</p>'
          social='''<div class="social-follow">Follow Bluia Sisters on</div><div class="social-grid"><a class="social-link social-instagram" href="https://www.instagram.com/bluia_sisters?dlrf=MWxoa2NheW8wbDc4Zw%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="icon-none" x="3" y="3" width="18" height="18" rx="5"/><circle class="icon-none" cx="12" cy="12" r="4"/><circle class="icon-white" cx="17.5" cy="6.5" r="1.2"/></svg></a><a class="social-link social-tiktok" href="https://www.tiktok.com/@bluia_sisters?_r=1&_t=ZG-9Ac3C5aA1Q1" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-white" d="M14.5 3h3.1c.2 1.6 1.1 2.9 2.7 3.7v3.1c-1.4-.1-2.8-.6-4-1.5v6.4a6 6 0 1 1-5.2-5.9v3.2a2.9 2.9 0 1 0 2.2 2.8V3h1.2z"/></svg></a><a class="social-link social-x" href="https://x.com/vbluia?s=11" target="_blank" rel="noopener noreferrer" aria-label="X"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-white" d="M18.8 3H22l-7 8 8.2 10H17l-4.9-6.1L6.8 21H3.6l7-8L2.7 3H9l4.4 5.5L18.8 3Zm-1.1 16h1.8L8 4.9H6.1L17.7 19Z"/></svg></a><a class="social-link social-facebook" href="https://www.facebook.com/share/1VENvhfpMJ/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-white" d="M13.8 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5H17V4a21 21 0 0 0-2.4-.1c-2.4 0-4.1 1.5-4.1 4.2V10H8v3h2.5v8h3.3Z"/></svg></a></div>'''
          if social not in s:
              if old not in s: raise SystemExit('member note target not found')
              s=s.replace(old,social+old,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add social media buttons to Members tab" || exit 0
          git push
