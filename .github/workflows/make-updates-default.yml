name: Make Updates First and Default

on:
  push:
    paths:
      - '.github/workflows/make-updates-default.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Updates first and default
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_nav='''    <button class="nav-btn active" data-panel="play" type="button">Magazine</button>\n    <button class="nav-btn" data-panel="updates" type="button">Updates <span class="media-count">26</span></button>\n    <button class="nav-btn" data-panel="members" type="button">Members <span class="media-count">1500</span></button>'''
          new_nav='''    <button class="nav-btn active" data-panel="updates" type="button">Updates <span class="media-count">26</span></button>\n    <button class="nav-btn" data-panel="play" type="button">Magazine</button>\n    <button class="nav-btn" data-panel="members" type="button">Members <span class="media-count">1500</span></button>'''
          if old_nav not in s:
              raise SystemExit('navigation marker missing')
          s=s.replace(old_nav,new_nav,1)
          old_panels='''    <section class="panel" id="panel-updates"><div class="feed-startup" id="feed-startup" aria-label="Loading Bluia Updates"><span></span><span></span><span></span></div><div class="feed" id="feed"></div><div class="feed-loader" id="feed-loader" aria-hidden="true"></div></section>\n    <section class="panel active" id="panel-play">'''
          new_panels='''    <section class="panel active" id="panel-updates"><div class="feed-startup" id="feed-startup" aria-label="Loading Bluia Updates"><span></span><span></span><span></span></div><div class="feed" id="feed"></div><div class="feed-loader" id="feed-loader" aria-hidden="true"></div></section>\n    <section class="panel" id="panel-play">'''
          if old_panels not in s:
              raise SystemExit('panel marker missing')
          s=s.replace(old_panels,new_panels,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Updates first and default tab" || exit 0
          git push
