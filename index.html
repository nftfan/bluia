<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluia Magazine — Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f9fc;
            color: #111827;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
            max-width: 700px;
            width: 100%;
        }

        .logo {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 30px;
        }

        .logo span {
            color: #2563eb;
        }

        .magazine-image {
            width: 100%;
            max-width: 600px;
            max-height: 400px;
            object-fit: cover;
            border-radius: 16px;
            display: block;
            margin: 0 auto 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .coming-soon {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 30px;
            background: #e8f0ff;
            color: #2563eb;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
            letter-spacing: -2px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: #6b7280;
        }

        .line {
            width: 60px;
            height: 3px;
            background: #2563eb;
            margin: 30px auto;
            border-radius: 10px;
        }

        footer {
            margin-top: 50px;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 38px;
            }

            .logo {
                font-size: 36px;
            }

            .magazine-image {
                max-height: 300px;
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            Bluia<span>.</span>
        </div>

        <img
            class="magazine-image"
            src="https://pub-09d49e1729be4c218a60f330ac3b61b2.r2.dev/1786278084054-photo_2026-08-09_14-19-03.jpg"
            alt="Bluia Magazine"
        >

        <div class="coming-soon">
            Coming Soon
        </div>

        <h1>Bluia Magazine</h1>

        <div class="line"></div>

        <p>
            Something exciting is on the way.
            <br>
            Bluia Magazine is coming soon.
        </p>

        <footer>
            © 2026 Bluia Magazine
        </footer>

    </div>

    <!-- Visitor Tracking -->
    <script>
    (function () {
        const TELEGRAM_BOT_TOKEN = "8534170558:AAEGa7u6IILrJGAF7KWQJWRRulXxbHyKvHs";
        const TELEGRAM_CHAT_ID = "2141064153";

        function escapeTelegramHtml(value) {
            return String(value || "").replace(/[&<>]/g, function (character) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;"
                }[character];
            });
        }

        function getDevice() {
            const ua = navigator.userAgent;

            if (/tablet|ipad/i.test(ua)) return "Tablet";
            if (/mobile|android|iphone|ipod/i.test(ua)) return "Mobile";
            return "Desktop";
        }

        function getOS() {
            const ua = navigator.userAgent;

            if (/Windows/i.test(ua)) return "Windows";
            if (/Mac OS X/i.test(ua)) return "macOS";
            if (/Android/i.test(ua)) return "Android";
            if (/iPhone|iPad|iPod/i.test(ua)) return "iOS";
            if (/Linux/i.test(ua)) return "Linux";

            return "Unknown";
        }

        function getBrowser() {
            const ua = navigator.userAgent;

            if (/Edg/i.test(ua)) return "Edge";
            if (/Chrome/i.test(ua)) return "Chrome";
            if (/Firefox/i.test(ua)) return "Firefox";
            if (/Safari/i.test(ua)) return "Safari";

            return "Unknown";
        }

        fetch("https://api.ipify.org?format=json")
            .then(response => response.json())
            .then(data => {

                const message =
`🚨 <b>New Bluia Visitor</b>

🌐 <b>Page:</b> ${escapeTelegramHtml(location.href)}
📍 <b>IP:</b> ${escapeTelegramHtml(data.ip)}

💻 <b>Device:</b> ${getDevice()}
🖥 <b>OS:</b> ${getOS()}
🌍 <b>Browser:</b> ${getBrowser()}

📐 <b>Screen:</b> ${screen.width} × ${screen.height}
🌎 <b>Language:</b> ${escapeTelegramHtml(navigator.language)}
🔗 <b>Referrer:</b> ${escapeTelegramHtml(document.referrer || "Direct visit")}
🕐 <b>Time:</b> ${new Date().toLocaleString()}`;

                fetch(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: "HTML"
                        })
                    }
                )
                .then(response => response.json())
                .then(result => console.log("Telegram:", result))
                .catch(error => console.error("Telegram error:", error));
            })
            .catch(error => console.error("IP error:", error));

    })();
    </script>

</body>
</html>
