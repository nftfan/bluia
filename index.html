<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bluia Sisters Magazine</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100svh;

    padding: 20px 18px 40px;

    display: flex;
    align-items: flex-start;
    justify-content: center;

    font-family: Arial, Helvetica, sans-serif;

    color: #49323a;

    background:
        radial-gradient(
            circle at top left,
            #ffe3ed 0%,
            transparent 42%
        ),
        radial-gradient(
            circle at bottom right,
            #ffdce9 0%,
            transparent 42%
        ),
        #fff8fb;
}


/* ================================
   MAIN CARD
================================ */

.card {
    width: min(100%, 430px);

    text-align: center;

    padding: 24px 24px 30px;

    background: rgba(255,255,255,.84);

    border: 1px solid #f2d6e0;

    border-radius: 30px;

    box-shadow:
        0 20px 60px rgba(173,75,111,.12);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}


/* ================================
   BRAND
================================ */

.brand {
    margin-bottom: 18px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 34px;

    letter-spacing: -1.5px;
}

.brand span {
    color: #d85c8c;
    font-style: italic;
}


/* ================================
   MAGAZINE COVER
================================ */

.cover-wrap {
    width: min(100%, 280px);

    margin: 0 auto 20px;

    padding: 7px;

    background: #fff;

    border-radius: 15px;

    box-shadow:
        0 15px 40px rgba(110,40,66,.14);
}

.cover {
    display: block;

    width: 100%;
    height: auto;

    border-radius: 10px;
}


/* ================================
   PRODUCT INFO
================================ */

.meta {
    margin-bottom: 19px;
}

.label {
    margin-bottom: 7px;

    color: #bc4a76;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.price {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 25px;

    color: #523741;
}


/* ================================
   BUTTONS
================================ */

.actions {
    display: grid;

    gap: 11px;
}

.button {
    min-height: 56px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 20px;

    border-radius: 100px;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.button:active {
    transform: scale(.98);
}


/* BUY */

.buy {
    color: white;

    background:
        linear-gradient(
            135deg,
            #ea76a2,
            #c83d73
        );

    box-shadow:
        0 12px 28px rgba(200,61,115,.25);
}

.buy:hover {
    transform: translateY(-2px);

    box-shadow:
        0 17px 34px rgba(200,61,115,.32);
}


/* PREVIEW */

.preview {
    color: #bd416f;

    background: #fff;

    border: 1px solid #efbfd1;
}

.preview:hover {
    background: #fff0f6;
}


/* ================================
   AFTER PAYMENT
================================ */

.after-payment {
    margin-top: 25px;

    padding-top: 21px;

    border-top: 1px solid #f0d5df;
}

.after-payment h2 {
    margin: 0 0 17px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 19px;
    font-weight: 400;

    color: #5d3846;
}

.steps {
    display: grid;

    gap: 12px;

    text-align: left;
}

.step {
    display: flex;

    align-items: flex-start;

    gap: 12px;

    color: #80616c;

    font-size: 12px;

    line-height: 1.55;
}

.number {
    width: 28px;
    min-width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 50%;

    background: #fbe3ec;

    color: #c74676;

    font-size: 11px;
    font-weight: 700;
}

.step-text {
    padding-top: 4px;
}


/* ================================
   PREVIEW MODAL
================================ */

.preview-modal {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    flex-direction: column;

    background: #fff6fa;
}

.preview-modal.open {
    display: flex;
}


/* ================================
   PREVIEW HEADER
================================ */

.preview-header {
    min-height: 60px;

    padding: 0 16px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    background:
        rgba(255,255,255,.94);

    border-bottom:
        1px solid #f1d2dd;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
}

.preview-title {
    color: #a33d64;

    font-size: 14px;
    font-weight: 700;
}


/* ================================
   CLOSE
================================ */

.close {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;

    border-radius: 50%;

    background: #fbe5ed;

    color: #b93f6d;

    font-size: 25px;

    cursor: pointer;
}

.close:hover {
    background: #f7d7e3;
}


/* ================================
   PDF
================================ */

.preview-frame {
    width: 100%;

    flex: 1;

    border: 0;

    background: #fff;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

    body {
        padding:
            10px
            12px
            28px;
    }

    .card {
        padding:
            20px
            17px
            25px;

        border-radius: 24px;
    }

    .brand {
        margin-bottom: 15px;

        font-size: 30px;
    }

    .cover-wrap {
        width:
            min(76vw, 265px);

        margin-bottom: 18px;
    }

    .button {
        min-height: 54px;

        font-size: 14px;
    }

    .after-payment {
        margin-top: 22px;
    }
}


@media (max-width: 360px) {

    body {
        padding-left: 8px;
        padding-right: 8px;
    }

    .card {
        padding-left: 14px;
        padding-right: 14px;
    }

    .cover-wrap {
        width:
            min(78vw, 245px);
    }
}

</style>
</head>


<body>


<main class="card">


    <!-- BRAND -->

    <div class="brand">
        Bluia <span>Sisters</span>
    </div>



    <!-- MAGAZINE COVER -->

    <div class="cover-wrap">

        <img
            class="cover"
            src="https://pub-09d49e1729be4c218a60f330ac3b61b2.r2.dev/1786278084054-photo_2026-08-09_14-19-03.jpg"
            alt="Bluia Sisters Magazine"
        >

    </div>



    <!-- PRODUCT -->

    <div class="meta">

        <div class="label">
            Digital Magazine
        </div>

        <div class="price">
            US$1
        </div>

    </div>



    <!-- ACTIONS -->

    <div class="actions">


        <!-- BUY -->

        <a
            class="button buy"
            id="buyButton"
            href="https://buy.stripe.com/28E7sD0Vq5Dwa5b6RhbAs02"
        >
            Buy Magazine — US$1
        </a>



        <!-- PREVIEW -->

        <a
            class="button preview"
            href="#"
            id="previewButton"
        >
            Preview Magazine
        </a>


    </div>



    <!-- AFTER PAYMENT -->

    <section class="after-payment">

        <h2>
            After payment
        </h2>


        <div class="steps">


            <div class="step">

                <div class="number">
                    1
                </div>

                <div class="step-text">
                    Complete your secure payment with Stripe.
                </div>

            </div>


            <div class="step">

                <div class="number">
                    2
                </div>

                <div class="step-text">
                    Open the URL shown after payment.
                </div>

            </div>


            <div class="step">

                <div class="number">
                    3
                </div>

                <div class="step-text">
                    Follow the instructions on that page to get your full copy of the Bluia Sisters Magazine.
                </div>

            </div>


        </div>

    </section>


</main>



<!-- ================================
     MAGAZINE PREVIEW
================================ -->

<div
    class="preview-modal"
    id="previewModal"
>

    <div class="preview-header">

        <div class="preview-title">
            Magazine Preview
        </div>


        <button
            class="close"
            id="closePreview"
            type="button"
            aria-label="Close preview"
        >
            ×
        </button>

    </div>


    <iframe
        class="preview-frame"
        id="previewFrame"
        title="Bluia Sisters Magazine Preview"
    ></iframe>

</div>



<script>

/* =========================================================
   MAGAZINE PREVIEW
========================================================= */

const PDF_URL =
    "https://files.catbox.moe/5a17f6.pdf";


const previewButton =
    document.getElementById("previewButton");


const previewModal =
    document.getElementById("previewModal");


const previewFrame =
    document.getElementById("previewFrame");


const closePreview =
    document.getElementById("closePreview");



/* OPEN PREVIEW */

previewButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        previewModal.classList.add(
            "open"
        );


        document.body.style.overflow =
            "hidden";


        if (
            !previewFrame.getAttribute("src")
        ) {

            previewFrame.src =
                PDF_URL;

        }

    }
);



/* CLOSE PREVIEW */

function closeMagazinePreview() {

    previewModal.classList.remove(
        "open"
    );


    document.body.style.overflow =
        "";

}


closePreview.addEventListener(
    "click",
    closeMagazinePreview
);



/* ESC KEY */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeMagazinePreview();

        }

    }
);



/* =========================================================
   TELEGRAM VISITOR ALERT
========================================================= */

(function () {


    const TELEGRAM_BOT_TOKEN =
        "8534170558:AAEGa7u6IILrJGAF7KWQJWRRulXxbHyKvHs";


    const TELEGRAM_CHAT_ID =
        "2141064153";



    /* -----------------------------
       ESCAPE TELEGRAM HTML
    ----------------------------- */

    function escapeTelegramHtml(value) {

        return String(value || "")
            .replace(
                /[&<>]/g,
                function(character) {

                    return {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;"
                    }[character];

                }
            );

    }



    /* -----------------------------
       DEVICE TYPE
    ----------------------------- */

    function getDevice() {

        const ua =
            navigator.userAgent;


        if (
            /tablet|ipad/i.test(ua)
        ) {

            return "Tablet";

        }


        if (
            /mobile|android|iphone|ipod/i.test(ua)
        ) {

            return "Mobile";

        }


        return "Desktop";

    }



    /* -----------------------------
       OPERATING SYSTEM
    ----------------------------- */

    function getOS() {

        const ua =
            navigator.userAgent;


        if (
            /Windows/i.test(ua)
        ) {

            return "Windows";

        }


        if (
            /Mac OS X/i.test(ua)
        ) {

            return "macOS";

        }


        if (
            /Android/i.test(ua)
        ) {

            return "Android";

        }


        if (
            /iPhone|iPad|iPod/i.test(ua)
        ) {

            return "iOS";

        }


        if (
            /Linux/i.test(ua)
        ) {

            return "Linux";

        }


        return "Unknown";

    }



    /* -----------------------------
       BROWSER
    ----------------------------- */

    function getBrowser() {

        const ua =
            navigator.userAgent;


        if (
            /Edg/i.test(ua)
        ) {

            return "Edge";

        }


        if (
            /Chrome/i.test(ua)
        ) {

            return "Chrome";

        }


        if (
            /Firefox/i.test(ua)
        ) {

            return "Firefox";

        }


        if (
            /Safari/i.test(ua)
        ) {

            return "Safari";

        }


        return "Unknown";

    }



    /* -----------------------------
       SEND TELEGRAM ALERT
    ----------------------------- */

    function sendTelegramAlert(data) {


        const country =
            data.country_name ||
            "Unknown";


        const countryCode =
            data.country_code
                ? " (" +
                  data.country_code +
                  ")"
                : "";


        const message = [

            "🌸 <b>New Bluia Sisters Magazine Visitor</b>",

            "",

            "🌐 <b>Page:</b> " +
            escapeTelegramHtml(
                location.href
            ),

            "📍 <b>IP:</b> " +
            escapeTelegramHtml(
                data.ip ||
                "Unknown"
            ),

            "🌍 <b>Country:</b> " +
            escapeTelegramHtml(
                country +
                countryCode
            ),

            "",

            "📱 <b>Device:</b> " +
            getDevice(),

            "💻 <b>OS:</b> " +
            getOS(),

            "🌐 <b>Browser:</b> " +
            getBrowser(),

            "",

            "📐 <b>Screen:</b> " +
            screen.width +
            " × " +
            screen.height,

            "🗣 <b>Language:</b> " +
            escapeTelegramHtml(
                navigator.language
            ),

            "🔗 <b>Referrer:</b> " +
            escapeTelegramHtml(
                document.referrer ||
                "Direct visit"
            ),

            "🕐 <b>Time:</b> " +
            escapeTelegramHtml(
                new Date()
                    .toLocaleString()
            )

        ].join("\n");



        const parameters =
            new URLSearchParams({

                chat_id:
                    TELEGRAM_CHAT_ID,

                text:
                    message,

                parse_mode:
                    "HTML"

            });



        const endpoint =
            "https://api.telegram.org/bot" +
            TELEGRAM_BOT_TOKEN +
            "/sendMessage";



        /*
           Image beacon avoids browser
           fetch/CORS problems.
        */

        const beacon =
            new Image();


        window.__bluiaTelegramBeacon =
            beacon;


        beacon.onload =
        beacon.onerror =
            function() {

                window.__bluiaTelegramBeacon =
                    null;

            };


        beacon.src =
            endpoint +
            "?" +
            parameters.toString();

    }



    /* -----------------------------
       VISITOR IP + COUNTRY
    ----------------------------- */

    const locationLookup =
        Promise.race([


            fetch(
                "https://ipapi.co/json/",
                {
                    cache:
                        "no-store"
                }
            )

            .then(
                function(response) {

                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            "Location lookup failed"
                        );

                    }


                    return response.json();

                }
            ),



            /*
               Don't delay the alert
               indefinitely if IP service
               doesn't respond.
            */

            new Promise(
                function(resolve) {

                    setTimeout(
                        function() {

                            resolve({});

                        },
                        3000
                    );

                }
            )

        ]);



    locationLookup

        .catch(
            function() {

                return {};

            }
        )

        .then(
            sendTelegramAlert
        );


})();

</script>


</body>
</html>
