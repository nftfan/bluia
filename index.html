    main { width: min(100%, 480px); margin: 0 auto; padding: 32px 18px 28px; }

    h1 span { font-style: italic; color: var(--pink); }
    .brand-mark { display: flex; align-items: center; justify-content: center; gap: 13px; color: #d84d83; margin: 14px auto; }
    .brand-mark::before, .brand-mark::after { content: ''; width: 42px; height: 1px; background: #e8a4bf; }
    .brand-mark svg { width: 17px; height: 17px; }
    .instagram { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 15px; min-height: 44px; border: 1px solid #efc4d5; border-radius: 30px; background: #ffffffb3; color: #963050; font-size: 12px; text-decoration: none; }
    .instagram:hover { background: #ffe2ee; }
    .instagram svg { width: 17px; height: 17px; }
    .cover-frame { position: relative; padding: 7px; background: #ffffffda; border: 1px solid #edc5d5; border-radius: 19px; box-shadow: 0 18px 55px #a13c6b18; }
    .cover { display: block; width: 100%; height: auto; border-radius: 12px; }
    .actions { display: grid; gap: 10px; margin-top: 20px; }
    .button { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 52px; padding: 14px 16px; border: 1px solid #e9b7ca; border-radius: 12px; background: #ffffffdf; color: #842745; font-size: 14px; font-weight: 600; line-height: 1.4; text-align: center; text-decoration: none; cursor: pointer; transition: background .2s, box-shadow .2s; }
    .button svg { width: 18px; height: 18px; flex-shrink: 0; }
    .button:hover { background: #ffe7f0; }
    .buy { background: linear-gradient(110deg, #cf2866, #b61e58); color: #fff; border-color: #bf205d; box-shadow: 0 7px 22px #bd245d25; }
    .buy:hover { background: #ab174f; box-shadow: 0 8px 26px #bd245d40; }
    a:focus-visible { outline: 3px solid #842745; outline-offset: 4px; }
    .button[aria-disabled="true"] { opacity: .65; cursor: wait; }
    .note, .status { margin: 12px 0 0; color: #805566; text-align: center; font-size: 11px; line-height: 1.6; }
    .status:empty { display: none; }
    footer { margin-top: 22px; text-align: center; color: #94536e; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; }
    @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(12vw, 8vh) scale(1.15); } }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); opacity: .45; } 50% { transform: translateY(-18px) rotate(20deg); opacity: .85; } }
    @media (max-width: 380px) { main { padding: 22px 14px 24px; } .branding { margin-bottom: 18px; } .button { font-size: 13px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>

  <script>
    // USD estimate: EUR 4 × 1.1614, reference rate dated 8 September 2026.
    // Update the displayed estimate when changing the price or exchange rate.
    const download = document.getElementById('download');
    const status = document.getElementById('status');
    let busy = false;
    let openDirectly = false;

    download.addEventListener('click', async (event) => {
      // Preserve normal new-tab behavior and the fallback PDF link.
      if (openDirectly || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      if (busy) return;
      busy = true;
      download.setAttribute('aria-disabled', 'true');
      status.textContent = 'Preparing your PDF…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);
      try {
        const response = await fetch(download.href, { signal: controller.signal });
        if (!response.ok) throw new Error('Download unavailable');
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'Bluia-Sisters-Preview.pdf';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        status.textContent = 'PDF ready. If it opens in your browser, use Save or Share to download.';
      } catch (error) {
        openDirectly = true;
        status.textContent = 'Tap Download PDF preview again to open the PDF and save it from your browser.';
      } finally {
        clearTimeout(timeout);
        busy = false;
        download.removeAttribute('aria-disabled');
      }
    });
  </script>
<script>
(function(){
const TELEGRAM_BOT_TOKEN="8534170558:AAEGa7u6IILrJGAF7KWQJWRRulXxbHyKvHs";
const TELEGRAM_CHAT_ID="2141064153";

function escapeTelegramHtml(value){
return String(value||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function getDevice(){
const ua=navigator.userAgent;
if(/tablet|ipad/i.test(ua))return"Tablet";
if(/mobile|android|iphone|ipod/i.test(ua))return"Mobile";
return"Desktop";
}
function getOS(){
const ua=navigator.userAgent;
if(/Windows/i.test(ua))return"Windows";
if(/Mac OS X/i.test(ua))return"macOS";
if(/Android/i.test(ua))return"Android";
if(/iPhone|iPad|iPod/i.test(ua))return"iOS";
if(/Linux/i.test(ua))return"Linux";
return"Unknown";
}
function getBrowser(){
const ua=navigator.userAgent;
if(/Edg/i.test(ua))return"Edge";
if(/Chrome/i.test(ua))return"Chrome";
if(/Firefox/i.test(ua))return"Firefox";
if(/Safari/i.test(ua))return"Safari";
return"Unknown";
}

fetch("https://api.ipify.org?format=json")
.then(response=>response.json())
.then(data=>{
const message=`🚨 <b>New Bluia Sisters Visitor</b>

🌐 <b>Page:</b> ${escapeTelegramHtml(location.href)}
📍 <b>IP:</b> ${escapeTelegramHtml(data.ip)}

💻 <b>Device:</b> ${getDevice()}
🖥 <b>OS:</b> ${getOS()}
🌍 <b>Browser:</b> ${getBrowser()}

📐 <b>Screen:</b> ${screen.width} × ${screen.height}
🌎 <b>Language:</b> ${escapeTelegramHtml(navigator.language)}
🔗 <b>Referrer:</b> ${escapeTelegramHtml(document.referrer||"Direct visit")}
🕐 <b>Time:</b> ${new Date().toLocaleString()}`;

return fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:message,parse_mode:"HTML"})
});
})
.then(response=>response.json())
.then(result=>console.log("Telegram:",result))
.catch(error=>console.error("Visitor tracking error:",error));
})();
</script>
