<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0b0d">
  <title>Bluia Sisters Requests</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0f0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
    .wrap{width:min(100%,720px);margin:0 auto}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .title{margin:0;font-size:20px;line-height:1.15}
    .sub{margin:4px 0 0;color:#9f8994;font-size:10px}
    .refresh{min-height:40px;padding:0 14px;border:1px solid #4b3140;border-radius:11px;background:#1b1317;color:#fff;font-size:10px;font-weight:800;cursor:pointer}
    .refresh:disabled{opacity:.55}
    .summary{margin:0 0 12px;padding:11px 12px;border:1px solid #35252d;border-radius:13px;background:#151013;color:#bdaab3;font-size:10px}
    .list{display:grid;gap:9px}
    .request{padding:13px;border:1px solid #35252d;border-radius:14px;background:linear-gradient(180deg,#171114,#120e10);box-shadow:0 8px 22px rgba(0,0,0,.2)}
    .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .email{font-size:13px;font-weight:850;line-height:1.25;word-break:break-word}
    .time{flex:0 0 auto;color:#8f7b85;font-size:8px;text-align:right;white-space:nowrap}
    .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
    .pill{padding:5px 7px;border-radius:999px;background:#241820;color:#d4bec8;font-size:8px}
    .empty,.error{padding:24px 14px;text-align:center;border:1px dashed #3b2a32;border-radius:14px;color:#9c8992;font-size:10px}
    .error{color:#ff9ab7}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div>
        <h1 class="title">Contact Requests</h1>
        <p class="sub">Bluia Sisters member contact requests</p>
      </div>
      <button class="refresh" id="refresh" type="button">Refresh</button>
    </div>
    <div class="summary" id="summary">Opening requests…</div>
    <div class="list" id="list"><div class="empty">Loading requests…</div></div>
  </main>

  <script type="module">
    const list=document.getElementById("list");
    const summary=document.getElementById("summary");
    const refresh=document.getElementById("refresh");

    const escapeHtml=value=>String(value??"").replace(/[&<>'\"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'\"':"&quot;"}[ch]));

    function formatTime(value){
      const n=Number(value||0);
      if(!n) return "Unknown time";
      const d=new Date(n);
      if(Number.isNaN(d.getTime())) return "Unknown time";
      return d.toLocaleString(undefined,{year:"numeric",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
    }

    function render(data){
      const items=data&&typeof data==="object"
        ? Object.entries(data).map(([id,value])=>({id,...(value||{})}))
        : [];
      items.sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));
      summary.textContent=`${items.length} request${items.length===1?"":"s"} · newest first`;
      if(!items.length){
        list.innerHTML='<div class="empty">No contact requests yet.</div>';
        return;
      }
      list.innerHTML=items.map(item=>`
        <article class="request">
          <div class="row">
            <div class="email">${escapeHtml(item.email||"No email")}</div>
            <div class="time">${escapeHtml(formatTime(item.createdAt))}</div>
          </div>
          <div class="meta">
            <span class="pill">${escapeHtml(item.sisterName||item.sisterId||"Bluia Sister")}</span>
            <span class="pill">${escapeHtml(item.source||"request")}</span>
          </div>
        </article>`).join("");
    }

    async function withTimeout(promise,ms){
      let timer;
      try{
        return await Promise.race([
          promise,
          new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error("Request timed out")),ms);})
        ]);
      }finally{
        clearTimeout(timer);
      }
    }

    async function load(){
      refresh.disabled=true;
      refresh.textContent="Loading…";
      summary.textContent="Loading requests…";
      list.innerHTML='<div class="empty">Connecting to Firebase…</div>';
      try{
        const [{initializeApp},{getDatabase,ref,get}]=await withTimeout(Promise.all([
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js")
        ]),8000);

        const app=initializeApp({
          apiKey:"AIzaSyDmDAHuk6CEObzaJMhIlvNReOI0K83wK0k",
          authDomain:"bluias.firebaseapp.com",
          databaseURL:"https://bluias-default-rtdb.firebaseio.com",
          projectId:"bluias",
          storageBucket:"bluias.firebasestorage.app",
          messagingSenderId:"604309456152",
          appId:"1:604309456152:web:71dfcb29cbcda483260a6d"
        },"req-page");

        const snap=await withTimeout(get(ref(getDatabase(app),"bluiaChat/v1/contactRequests")),8000);
        render(snap.exists()?snap.val():null);
      }catch(error){
        console.error("Requests page error",error);
        summary.textContent="Could not load requests.";
        list.innerHTML='<div class="error">Firebase did not return the requests. If this stays here after Refresh, the database read rule for contactRequests must allow this page to read them.</div>';
      }finally{
        refresh.disabled=false;
        refresh.textContent="Refresh";
      }
    }

    refresh.addEventListener("click",load);
    load();
  </script>
</body>
</html>
