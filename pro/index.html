<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bluia Pro has moved</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #050505;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: min(560px, 100%); }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 999px;
      background: #fff;
      color: #050505;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }
    a:hover { opacity: .88; }
  </style>
</head>
<body>
  <main>
    <h1>This website has been moved to bluias.com</h1>
    <a href="https://bluias.com/pro">Go to bluias.com</a>

</html>
